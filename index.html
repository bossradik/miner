<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⛏️ Шахтёр 2.0</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            margin: 0;
            padding: 8px;
        }

        .game-container {
            width: calc(100% - 16px);
            max-width: 400px;
            background: linear-gradient(145deg, #34495e, #2c3e50);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 16px;
            box-shadow: inset -1px -1px 3px rgba(0,0,0,0.4);
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #7f8c8d;
            border-radius: 5px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background-color: #27ae60;
            transition: width 0.3s ease-out;
        }

        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            background-image: linear-gradient(to bottom, #fff, #dcdcdc); 
            color: black !important;
        }

        button:active,
        button:focus {
            transform: translateY(2px);
            filter: brightness(0.9);
        }

        #mineBtn { background-color: #e67e22; background-image: linear-gradient(to bottom, #ffb347, #c87f1a); color: white; }
        #buyPickBtn { background-color: #3498db; background-image: linear-gradient(to bottom, #6dd5ed, #2980b9); color: white; }
        #sellStoneBtn { background-color: #95a5a6; background-image: linear-gradient(to bottom, #cce0ea, #777); color: white; }
        #restBtn { background-color: #34495E; background-image: linear-gradient(to bottom, #5B6D7C, #2A3845); color: white; }

        .tap-pop {
            position: absolute;
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            animation: popUp 0.8s forwards;
            z-index: 10;
        }

        @keyframes popUp {
            0% { opacity: 0; transform: scale(0) translateY(0); }
            70% { opacity: 1; transform: scale(1.1) translateY(-20px); }
            100% { transform: scale(1) translateY(-30px); opacity: 0; }
        }

        .shop-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #34495e;
        }

        #pickaxeName {
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>⛏️ Шахтёр 2.0</h1>

    <div class="stat-row"><span>⭐ Уровень:</span><span id="level"></span></div>
    <div class="progress-bar progress-xp"><div id="xpFill" class="progress-fill"></div></div>
    <div class="stat-row"><span>✨ Опыт:</span><span id="xp"></span>/<span id="xpToLevel"></span></div>

    <div class="progress-bar progress-energy"><div id="energyFill" class="progress-fill"></div></div>
    <div class="stat-row"><span>⚡ Энергия:</span><span id="energy"></span>/<span id="maxEnergy"></span></div>

    <p id="hintText" style="font-style: italic; color: #bdc3c7;">Нажми "КОПАТЬ", чтобы начать!</p>

    <div id="btnContainer" style="position: relative; min-height: 60px;">
        <button id="mineBtn">⛏️ КОПАТЬ!</button>
    </div>

    <div class="stat-row"><span>🪨 Камня:</span><span id="stone"></span></div>
    <div class="stat-row"><span>⛓️ Железа:</span><span id="iron"></span></div>
    <div class="stat-row"><span>🥇 Золота:</span><span id="gold"></span></div>
    <div class="stat-row"><span>💎 Алмазов:</span><span id="diamond"></span></div>
    <div class="stat-row"><span>🪙 Монет:</span><span id="coins"></span></div>

    <div class="shop-section">
        <h3>🛒 Магазин и Рынок:</h3>
        <div class="stat-row"><span>Текущая кирка:</span><span id="pickaxeName">Загрузка...</span></div>
        <button id="buyPickBtn">⛏️ Улучшить кирку<br><small id="pickaxeCost">50 🪙</small></button>
        <button id="sellStoneBtn">💰 Продать 10 Камня<br><small>+5 🪙</small></button>

        <button id="restBtn">🛌 Отдохнуть<br><small>+100 ⚡ за 100 🪙</small></button>
    </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const pickaxes = [
    { name: "🪵 Деревянная", power: 1, cost: 0 },
    { name: "🪨 Каменная", power: 2, cost: 75 },
    { name: "⛓️ Железная", power: 4, cost: 300 },
    { name: "🥇 Золотая", power: 8, cost: 900 },
    { name: "💎 Алмазная", power: 16, cost: 2_500 },
    { name: "🔥 Огненная", power: 32, cost: 7_500 },
    { name: "🧙‍♂️ Магическая", power: 64, cost: 25_000 },
    { name: "🚀 Космическая", power: 128, cost: 100_000 }
];

let game = JSON.parse(localStorage.getItem('miner_save')) || {
    stone: 0, iron: 0, gold: 0, diamond: 0, coins: 0,
    energy: 100, maxEnergy: 100, level: 1, xp: 0, xpToLevel: 50,
    pickaxeLevel: 1, power: 1
};

function saveGame() {
    localStorage.setItem('miner_save', JSON.stringify(game));
}

function updateUI() {
    document.getElementById('stone').innerText = game.stone;
    document.getElementById('iron').innerText = game.iron;
    document.getElementById('gold').innerText = game.gold;
    document.getElementById('diamond').innerText = game.diamond;
    document.getElementById("coins").innerText = game.coins; // Исправлено

    document.getElementById('energy').innerText = game.energy;
    document.getElementById('maxEnergy').innerText = game.maxEnergy;
    document.getElementById('level').innerText = game.level;
    document.getElementById('xp').innerText = game.xp;
    document.getElementById('xpToLevel').innerText = game.xpToLevel;

    const currentPickIndex = Math.min(game.pickaxeLevel - 1, pickaxes.length - 1);
    let currentPick = pickaxes[currentPickIndex] || pickaxes[0];
    game.power = currentPick.power;
    document.getElementById('pickaxeName').innerText = `${currentPick.name} (Сила: ${currentPick.power})`; // Исправлено

    document.getElementById('energyFill').style.width = ((game.energy / game.maxEnergy) * 100).toFixed(1) + "%";
    document.getElementById('xpFill').style.width = ((game.xp / game.xpToLevel) * 100).toFixed(1) + "%";

    let nextPick = pickaxes[game.pickaxeLevel];
    if (nextPick) {
        document.getElementById('pickaxeCost').innerText = nextPick.cost + " 🪙";
        document.getElementById('buyPickBtn').disabled = game.coins < nextPick.cost;
    } else {
        document.getElementById('pickaxeCost').innerText = "МАКС.";
        document.getElementById('buyPickBtn').disabled = true;
    }

    const mineBtn = document.getElementById('mineBtn');
    if (game.energy <= 0) {
        mineBtn.disabled = true;
        mineBtn.innerText = "⏳ НЕТ ЭНЕРГИИ";
    } else {
        mineBtn.disabled = false;
        mineBtn.innerText = "⛏️ КОПАТЬ!";
    }
}

// Не забудьте добавить обработчики событий для кнопок
document.getElementById('mineBtn').addEventListener('click', () => {
    // Ваш код для копания
});
document.getElementById('buyPickBtn').addEventListener('click', () => {
    // Ваш код для покупки кирки
});
document.getElementById('sellStoneBtn').addEventListener('click', () => {
    // Ваш код для продажи камня
});
document.getElementById('restBtn').addEventListener('click', () => {
    // Ваш код для отдыха
});

// Инициализация интерфейса
updateUI();
</script>
</body>
</html>
