<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>⛏️ Шахтёр 6.0</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 12px;
    background: #101820;
    color: #ffffff;
    font-family: Arial, sans-serif;
}

.game {
    max-width: 430px;
    margin: auto;
    background: #1c2932;
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 10px 35px #0008;
}

h1 {
    margin: 0 0 12px;
    text-align: center;
    font-size: 26px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.stat {
    text-align: center;
    background: #344854;
    padding: 10px;
    border-radius: 10px;
}

.stat b {
    display: block;
    font-size: 19px;
    margin-top: 4px;
}

.box,
.section {
    background: #263842;
    border-radius: 14px;
    padding: 12px;
    margin-top: 10px;
}

.mine {
    text-align: center;
}

.pick {
    font-size: 70px;
}

.minebtn {
    width: 100%;
    padding: 20px;
    margin-top: 10px;
    border: 0;
    border-radius: 15px;
    background: #e69a22;
    color: #ffffff;
    font-size: 23px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
}

.minebtn:active {
    transform: scale(0.97);
}

.minebtn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.energy,
.bag {
    height: 11px;
    background: #101820;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 8px;
}

.fill {
    height: 100%;
    background: #39d98a;
    width: 100%;
    transition: width 0.2s;
}

.inv {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
}

.item {
    background: #18242c;
    padding: 10px;
    border-radius: 9px;
    display: flex;
    justify-content: space-between;
}

.market,
.upgrade {
    width: 100%;
    margin-top: 7px;
    padding: 12px;
    border: 0;
    border-radius: 10px;
    background: #425966;
    color: #ffffff;
    font-size: 15px;
    cursor: pointer;
}

.market:active,
.upgrade:active {
    transform: scale(0.98);
}

.msg {
    text-align: center;
    color: #ffd166;
    min-height: 24px;
    margin: 9px;
}
</style>
</head>

<body>

<div class="game">

    <h1>⛏️ Шахтёр 6.0</h1>

    <div class="stats">

        <div class="stat">
            💰
            <b id="coins">0</b>
        </div>

        <div class="stat">
            ⭐
            <b id="level">1</b>
        </div>

        <div class="stat">
            ✨
            <b id="xp">0</b>
        </div>

    </div>


    <div class="box mine">

        <div class="pick">
            ⛏️
        </div>

        <div>
            Глубина:
            <b id="depth">0</b>
            м
        </div>


        <button
            class="minebtn"
            id="mine"
            type="button"
        >
            ⛏️ КОПАТЬ
        </button>


        <div class="energy">
            <div
                class="fill"
                id="energyFill"
            ></div>
        </div>

        <div>
            ⚡ Энергия:
            <b id="energy">100</b>/100
        </div>


        <div
            class="msg"
            id="msg"
        >
            Нажми «КОПАТЬ»!
        </div>

    </div>


    <div class="section">

        <h3>
            🎒 Рюкзак
            <span id="bagText">
                0/30
            </span>
        </h3>


        <div class="bag">
            <div
                class="fill"
                id="bagFill"
            ></div>
        </div>


        <div class="inv">

            <div class="item">
                🪨 Камень
                <b id="stone">0</b>
            </div>

            <div class="item">
                ⛓️ Железо
                <b id="iron">0</b>
            </div>

            <div class="item">
                🥇 Золото
                <b id="gold">0</b>
            </div>

            <div class="item">
                💎 Алмаз
                <b id="diamond">0</b>
            </div>

            <div class="item">
                🔴 Рубин
                <b id="ruby">0</b>
            </div>

            <div class="item">
                🟣 Аметист
                <b id="amethyst">0</b>
            </div>

        </div>


        <button
            class="upgrade"
            id="bagUp"
            type="button"
        >
            🎒 Увеличить рюкзак — 100 🪙
        </button>

    </div>


    <div class="section">

        <h3>
            ⛏️ Кирка
        </h3>

        <div>
            Уровень:
            <b id="pickLevel">1</b>
        </div>

        <div>
            ⚡ Сила:
            <b id="power">1</b>
        </div>


        <button
            class="upgrade"
            id="pickUp"
            type="button"
        >
            ⚒️ Улучшить — 150 🪙
        </button>

    </div>


    <div class="section">

        <h3>
            💰 Рынок
        </h3>


        <button
            class="market"
            data-r="stone"
            type="button"
        >
            🪨 Камень — 1 🪙
        </button>


        <button
            class="market"
            data-r="iron"
            type="button"
        >
            ⛓️ Железо — 8 🪙
        </button>


        <button
            class="market"
            data-r="gold"
            type="button"
        >
            🥇 Золото — 35 🪙
        </button>


        <button
            class="market"
            data-r="diamond"
            type="button"
        >
            💎 Алмаз — 250 🪙
        </button>


        <button
            class="market"
            data-r="ruby"
            type="button"
        >
            🔴 Рубин — 600 🪙
        </button>


        <button
            class="market"
            data-r="amethyst"
            type="button"
        >
            🟣 Аметист — 1000 🪙
        </button>

    </div>

</div>


<script>

const SAVE_KEY = "miner_6_simple_save";


let game = {

    coins: 0,

    level: 1,

    xp: 0,

    depth: 0,

    energy: 100,

    maxEnergy: 100,

    bagSize: 30,

    stone: 0,

    iron: 0,

    gold: 0,

    diamond: 0,

    ruby: 0,

    amethyst: 0,

    pickaxeLevel: 1,

    power: 1

};


const prices = {

    stone: 1,

    iron: 8,

    gold: 35,

    diamond: 250,

    ruby: 600,

    amethyst: 1000

};


function $(id) {

    return document.getElementById(id);

}


function totalBag() {

    return (
        game.stone +
        game.iron +
        game.gold +
        game.diamond +
        game.ruby +
        game.amethyst
    );

}


function saveGame() {

    try {

        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify(game)
        );

    } catch (error) {

        console.log(
            "Не удалось сохранить игру"
        );

    }

}


function loadGame() {

    try {

        const saved =
            localStorage.getItem(
                SAVE_KEY
            );


        if (saved) {

            const data =
                JSON.parse(saved);


            Object.keys(game).forEach(
                function(key) {

                    if (
                        typeof data[key] ===
                        "number"
                    ) {

                        game[key] =
                            data[key];

                    }

                }
            );

        }

    } catch (error) {

        console.log(
            "Не удалось загрузить сохранение"
        );

    }

}


function showMessage(text) {

    $("msg").textContent = text;

}


function addXP(amount) {

    game.xp += amount;


    const needed =
        game.level * 100;


    if (game.xp >= needed) {

        game.xp -= needed;

        game.level++;

        game.maxEnergy += 5;

        game.energy =
            game.maxEnergy;


        showMessage(
            "🎉 Новый уровень: " +
            game.level
        );

    }

}


function render() {

    const used =
        totalBag();


    $("coins").textContent =
        game.coins;


    $("level").textContent =
        game.level;


    $("xp").textContent =
        game.xp;


    $("depth").textContent =
        game.depth;


    $("energy").textContent =
        game.energy;


    $("stone").textContent =
        game.stone;


    $("iron").textContent =
        game.iron;


    $("gold").textContent =
        game.gold;


    $("diamond").textContent =
        game.diamond;


    $("ruby").textContent =
        game.ruby;


    $("amethyst").textContent =
        game.amethyst;


    $("bagText").textContent =
        used +
        "/" +
        game.bagSize;


    $("pickLevel").textContent =
        game.pickaxeLevel;


    $("power").textContent =
        game.power;


    $("energyFill").style.width =
        Math.max(
            0,
            game.energy /
            game.maxEnergy *
            100
        ) +
        "%";


    $("bagFill").style.width =
        Math.min(
            100,
            used /
            game.bagSize *
            100
        ) +
        "%";


    $("mine").disabled =
        game.energy <= 0 ||
        used >= game.bagSize;

}


function mine() {

    if (
        game.energy <= 0
    ) {

        showMessage(
            "⚡ Нет энергии!"
        );

        return;

    }


    if (
        totalBag() >=
        game.bagSize
    ) {

        showMessage(
            "🎒 Рюкзак заполнен!"
        );

        return;

    }


    game.energy--;

    game.depth +=
        game.power;


    /*
       Каждый удар
       гарантированно даёт камень.
    */

    game.stone++;

    addXP(2);


    /*
       Шанс найти редкие ресурсы.
    */

    const roll =
        Math.random();


    if (
        roll < 0.01 &&
        totalBag() < game.bagSize
    ) {

        game.diamond++;

        addXP(30);

        showMessage(
            "💎 ТЫ НАШЁЛ АЛМАЗ!"
        );

    }

    else if (
        roll < 0.03 &&
        totalBag() < game.bagSize
    ) {

        game.ruby++;

        addXP(20);

        showMessage(
            "🔴 Найден рубин!"
        );

    }

    else if (
        roll < 0.06 &&
        totalBag() < game.bagSize
    ) {

        game.amethyst++;

        addXP(15);

        showMessage(
            "🟣 Найден аметист!"
        );

    }

    else if (
        roll < 0.16 &&
        totalBag() < game.bagSize
    ) {

        game.gold++;

        addXP(10);

        showMessage(
            "🥇 Найдено золото!"
        );

    }

    else if (
        roll < 0.35 &&
        totalBag() < game.bagSize
    ) {

        game.iron++;

        addXP(5);

        showMessage(
            "⛓️ Найдено железо!"
        );

    }

    else {

        showMessage(
            "🪨 Камень добыт!"
        );

    }


    saveGame();

    render();

}


/*
   ГЛАВНАЯ КНОПКА.
   Здесь нет Telegram,
   CloudStorage или ready.
*/

$("mine").addEventListener(
    "click",
    function() {

        mine();

    }
);


/*
   Продажа ресурсов.
*/

document
    .querySelectorAll(".market")
    .forEach(
        function(button) {

            button.addEventListener(
                "click",
                function() {

                    const resource =
                        button.dataset.r;


                    const amount =
                        game[resource];


                    if (
                        amount <= 0
                    ) {

                        showMessage(
                            "❌ У тебя нет этого ресурса."
                        );

                        return;

                    }


                    const earned =
                        amount *
                        prices[resource];


                    game.coins +=
                        earned;


                    game[resource] =
                        0;


                    showMessage(
                        "💰 Продано: +" +
                        earned +
                        " монет"
                    );


                    saveGame();

                    render();

                }
            );

        }
    );


/*
   Улучшение рюкзака.
*/

$("bagUp").addEventListener(
    "click",
    function() {

        const cost =
            game.bagSize * 4;


        if (
            game.coins < cost
        ) {

            showMessage(
                "❌ Нужно " +
                cost +
                " монет."
            );

            return;

        }


        game.coins -=
            cost;


        game.bagSize +=
            20;


        showMessage(
            "🎒 Рюкзак увеличен!"
        );


        saveGame();

        render();

    }
);


/*
   Улучшение кирки.
*/

$("pickUp").addEventListener(
    "click",
    function() {

        const cost =
            game.pickaxeLevel *
            150;


        if (
            game.coins < cost
        ) {

            showMessage(
                "❌ Нужно " +
                cost +
                " монет."
            );

            return;

        }


        game.coins -=
            cost;


        game.pickaxeLevel++;

        game.power++;


        showMessage(
            "⛏️ Кирка улучшена!"
        );


        saveGame();

        render();

    }
);


/*
   Восстановление энергии.
*/

setInterval(
    function() {

        if (
            game.energy <
            game.maxEnergy
        ) {

            game.energy++;

            saveGame();

            render();

        }

    },
    3000
);


/*
   Запуск игры.
*/

<div id="dailyInfo" style="background:#18242c;padding:12px;border-radius:10px;text-align:center;margin-bottom:8px;">

</div>

amond++;xp(30);msg("💎 АЛМАЗ!")}else if(r<.03&&total()<s.bagSize){s.ruby++;xp(20);msg("🔴 Рубин!")}else if(r<.06&&total()<s.bagSize){s.amethyst++;xp(15);msg("🟣 Аметист!")}else if(r<.16&&total()<s.bagSize){s.gold++;xp(10);msg("🥇 Золото!")}else if(r<.35&&total()<s.bagSize){s.iron++;xp(5);msg("⛓️ Железо!")}else msg("🪨 Камень добыт!");save();render()}$("mine").addEventListener("click",mine);document.querySelectorAll(".market").forEach(b=>b.addEventListener("click",()=>{let r=b.dataset.r;if(!s[r])return msg("❌ Ничего нет!");s.coins+=s[r]*price[r];s[r]=0;msg("💰 Продано!");save();render()}));$("bagUp").onclick=()=>{let c=s.bagSize*4;if(s.coins<c)return msg("❌ Нужно "+c+" монет");s.coins-=c;s.bagSize+=20;save();render();msg("🎒 Рюкзак увеличен!")};$("pickUp").onclick=()=>{let c=s.pickLevel*150;if(s.coins<c)return msg("❌ Нужно "+c+" монет");s.coins-=c;s.pickLevel++;s.power++;save();render();msg("⛏️ Кирка улучшена!")};setInterval(()=>{if(s.energy<s.maxEnergy){s.energy++;save();render()}},3000);load();render();

 if((s.dailyLast||0)===today){

 }
}

 if((s.dailyLast||0)===today){

 }
 if(s.dailyLast&&today-s.dailyLast>1)s.dailyDay=1;
 const day=Math.min(7,Math.max(1,s.dailyDay||1));
 if(day===1)s.coins+=100;
 else if(day===2)s.coins+=200;

 else{s.coins+=2000;s.diamond+=2;}

 s.dailyDay=day>=7?1:day+1;
 save();
 render();
 updateDailyBonus();
 msg("🎁 Бонус дня "+day+" получен!");
}
);
