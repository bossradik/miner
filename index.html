<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>⛏️ Шахтёр 2.0</title>
    
    <!-- ПОДКЛЮЧЕНИЕ БИБЛИОТЕКИ ДЛЯ ЗАЩИТЫ СОХРАНЕНИЙ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .game-container {
            width: 90%;
            max-width: 400px;
            background: linear-gradient(145deg, #34495e, #2c3e50);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        h1 {
            margin-top: 0;
            font-size: 24px;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
            font-size: 16px;
        }
        /* Иконки кирок */
        [data-pickaxe]::before {
            content: '';
            display: inline-block;
            vertical-align: middle;
            width: 1em; 
            height: 1em;
            margin-right: 0.2em;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
        }
        [data-pickaxe='wood']::before {background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22currentColor%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 class=%22lucide lucide-hammer%22%3E%3Cg transform=%22translate(-7 -1)%22%3E%3Cpath d=%22M13.5 1v11a1 1 0 0 0 1 1h7m-7 1v11a1 1 0 0 0 1 1H23%22/%3E%3Cline x1=%2210%22 y1=%2214%22 x2=%2210%22 y2=%2223%22/%3E%3Cline x1=%2210%22 y1=%2214%22 x2=%224%22 y2=%2214%22/%3E%3Cline x1=%224%22 y1=%2214%22 x2=%224%22 y2=%2223%22/%3E%3C/g%3E%3C/svg%3E');}
        [data-pickaxe='stone']::before {background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22currentColor%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 class=%22lucide lucide-hammer%22%3E%3Cg transform=%22translate(-7 -1)%22%3E%3Cpath d=%22M13.5 1v11a1 1 0 0 0 1 1h7m-7 1v11a1 1 0 0 0 1 1H23%22/%3E%3Cline x1=%2210%22 y1=%2214%22 x2=%2210%22 y2=%2223%22/%3E%3Cline x1=%2210%22 y1=%2214%22 x2=%224%22 y2=%2214%22/%3E%3Cline x1=%224%22 y1=%2214%22 x2=%224%22 y2=%2223%22/%3E%3C/g%3E%3C/svg%3E'); filter: brightness(1.2) grayscale(0.7);}
        [data-pickaxe='iron']::before {background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22currentColor%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 class=%22lucide lucide-hammer%22%3E%3Cg transform=%22translate(-7 -1)%22%3E%3Cpath d=%22M13.5 1v11a1 1 0 0 0 1 1h7m-7 1v11a1 1 0 0 0 1 1H23%22/%3E%3Cline x1=%2210%22 y1=%2214%22 x2=%2210%22 y2=%2223%22/%3E%3Cline x1=%2210%22 y1=%2214%22 x2=%224%22 y2=%2214%22/%3E%3Cline x1=%224%22 y1=%2214%22 x2=%224%22 y2=%2223%22/%3E%3C/g%3E%3C/svg%3E'); filter: hue-rotate(200deg);} /* синий */
        [data-pickaxe='gold']::before {background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22currentColor%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 class=%22lucide lucide-hammer%22%3E%3Cg transform=%22translate(-7 -1)%22%3E%3Cpath d=%22M13.5 1v11a1 1 0 0 0 1 1h7m-7 1v11a1 1 0 0 0 1 1H23%22/%3E%3Cline x1=%2210%22 y1=%2214%22 x2=%2210%22 y2=%2223%22/%3E%3Cline x1=%2210%22 y1=%2214%22 x2=%224%22 y2=%2214%22/%3E%3Cline x1=%224%22 y1=%2214%22 x2=%224%22 y2=%2223%22/%3E%3C/g%3E%3C/svg%3E'); filter: sepia(1) saturate(10);} /* золото */
        [data-pickaxe='diamond']::before {background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewViewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22currentColor%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 class=%22lucide lucide-hammer%22%3E%3Cg transform=%22translate(-7 -1)%22%3E%3Cpath d=%22M13.5 1v11a1 1 0 0 0 1 1h7m-7 1v11a1 1 0 0 0 1 1H23%22/%3E%3Cline x1=%2210%22 y1=%2214%22 x2=%2210%22 y2=%2223%22/%3E%3Cline x1=%2210%22 y1=%2214%22 x2=%224%22 y2=%2214%22/%3E%3Cline x1=%224%22 y1=%2214%22 x2=%224%22 y2=%2223%22/%3E%3C/g%3E%3C/svg%3E'); filter: contrast(1.5) brightness(1.5);} /* кристалл */
        [data-pickaxe='obsidian']::before {background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22currentColor%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 class=%22lucide lucide-hammer%22%3E%3Cg transform=%22translate(-7 -1)%22%3E%3Cpath d=%22M13.5 1v11a1 1 0 0 0 1 1h7m-7 1v11a1 1 0 0 0 1 1H23%22/%3E%3Cline x1=%2210%22 y1=%2214%22 x2=%2210%22 y2=%2223%22/%3E%3Cline x1=%2210%22 y1=%2214%22 x2=%224%22 y2=%2214%22/%3E%3Cline x1=%224%22 y1=%2214%22 x2=%224%22 y2=%2223%22/%3E%3C/g%3E%3C/svg%3E'); filter: invert(1) opacity(0.8);}
        [data-pickaxe='netherite']::before {background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22currentColor%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 class=%22lucide lucide-hammer%22%3E%3Cg transform=%22translate(-7 -1)%22%3E%3Cpath d=%22M13.5 1v11a1 1 0 0 0 1 1h7m-7 1v11a1 1 0 0 0 1 1H23%22/%3E%3Cline x1=%2210%22 y1=%2214%22 x2=%2210%22 y2=%2223%22/%3E%3Cline x1=%2210%22 y1=%2214%22 x2=%224%22 y2=%2214%22/%3E%3Cline x1=%224%22 y1=%2214%22 x2=%224%22 y2=%2223%22/%3E%3C/g%3E%3C/svg%3E'); filter: hue-rotate(280deg) brightness(1.2);}
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #7f8c8d;
            border-radius: 5px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background-color: #27ae60;
            transition: width 0.3s ease;
        }
        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .shop-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #34495e;
        }
        .tap-pop {
            position: absolute;
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            animation: popUp 0.8s forwards;
            z-index: 10;
        }
        @keyframes popUp {
            0% { 
                opacity: 0;
                transform: scale(0) translateY(0);
            }
            70% { 
                opacity: 1;
                transform: scale(1.1) translateY(-20px);
            }
            100% { 
                transform: scale(1) translateY(-30px);
                opacity: 0;
            }
        }

        /* Таймер счастливых часов */
        .happy-timer {
            font-size: 14px;
            color: #bdc3c7;
            margin-bottom: 10px;
        }
        .happy-active {
            color: #27ae60 !important;
            font-style: italic;
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>⛏️ Шахтёр 2.0</h1>

    <!-- Статистика игрока -->
    <div class="stat-row"><span>⭐ Уровень:</span><span id="level">1</span></div>
    <div class="progress-bar"><div id="xpFill" class="progress-fill"></div></div>
    <div class="stat-row"><span>✨ Опыт:</span><span id="xp">0</span>/<span id="xpToLevel">50</span></div>

    <div class="progress-bar"><div id="energyFill" class="progress-fill"></div></div>
    <div class="stat-row"><span>⚡ Энергия:</span><span id="energy">100</span>/<span id="maxEnergy">100</span></div>

    <p id="hintText" style="font-style: italic; color: #bdc3c7;">Нажми "КОПАТЬ", чтобы начать!</p>

    <!-- Кнопки действий -->
    <div id="btnContainer" style="position: relative; min-height: 60px;">
        <button id="mineBtn">⛏️ КОПАТЬ!</button>
    </div>

    <!-- Ресурсы -->
    <div class="stat-row"><span>🪨 Камень:</span><span id="stone">0</span></div>
    <div class="stat-row"><span>⛓️ Железо:</span><span id="iron">0</span></div>
    <div class="stat-row"><span>🥇 Золото:</span><span id="gold">0</span></div>
    <div class="stat-row"><span>💎 Алмазы:</span><span id="diamond">0</span></div>
    <div class="stat-row"><span>🪙 Монеты:</span><span id="coins">0</span></div>

    <!-- Магазин и Рынок -->
    <div class="shop-section">
        <div class="happy-timer">Следующий шанс счастья через <span id="nextHappyTime">...</span></div>
        <div class="stat-row"><span data-pickaxe="wood">Текущая кирка:</span><span id="pickaxeName">Загрузка...</span></div>
        <button id="buyPickBtn">⛏️ Улучшить кирку<br><small id="pickaxeCost">50 🪙</small></button>
        <button id="sellStoneBtn">💰 Продать 10 Камня<br><small>+5 🪙</small></button>
    </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ✅ УЛУЧШЕННАЯ ЗАЩИТА
function calculateChecksum(obj) {
    const cleanObj = Object.fromEntries(Object.entries(obj).filter(([k]) => k !== 'checksum'));
    return CryptoJS.SHA256(JSON.stringify(cleanObj)).toString();
}

// Проверяет целостность данных перед КАЖДОЙ операцией
function verifySave() {
    if (!game.checksum || game.checksum !== calculateChecksum(game)) {
        throw new Error("Save corrupted");
    }
}

// Список ВСЕХ кирок (с иконками)
const pickaxes = [
    { name: "🪵 Деревянная", power: 1, cost: 0 },
    { name: "🪨 Каменная", power: 2, cost: 50 },
    { name: "⛓️ Железная", power: 5, cost: 150 },
    { name: "🥇 Золотая", power: 12, cost: 400 },
    { name: "💎 Алмазная", power: 30, cost: 1000 },
    // Новые виды!
    { name: "🔥 Обсидиановая", power: 60, cost: 2500 }, // Obsidian
    { name: "🌈 Радужная", power: 100, cost: 5000 }, // Rainbow
    { name: "🧲 Древняя", power: 200, cost: 10_000 }, // Ancient
    { name: "🖤 Метеоритная", power: 400, cost: 20_000 }, // Meteorite
    { name: "🦾 Звёздная", power: 1000, cost: 50_000 } // Star
];

let game = JSON.parse(localStorage.getItem('miner_save')) || {};
try {
    verifySave();
    delete game.checksum;
} catch (e) {
    game = {
        stone: 0,
        iron: 0,
        gold: 0,
        diamond: 0,
        coins: 0,
        energy: 100,
        maxEnergy: 100,
        level: 1,
        xp: 0,
        xpToLevel: 50,
        pickaxeLevel: 1,
        happyUntil: Date.now(), // Время окончания бонуса
        nextHappyAt: Date.now() + Math.random() * 3600000 // Следующее событие через 0–1 час
    };
}

function saveGame() {
    try {
        verifySave(); // Пытаемся проверить данные ещё раз
    } catch(e) {}

    game.checksum = calculateChecksum(game);
    localStorage.setItem('miner_save', JSON.stringify(game));
}

function updateUI() {
    document.getElementById('stone').innerText = game.stone;
    document.getElementById('iron').innerText = game.iron;
    document.getElementById('gold').innerText = game.gold;
    document.getElementById('diamond').innerText = game.diamond;
    document.getElementById('coins').innerText = game.coins;

    document.getElementById('energy').innerText = game.energy;
    document.getElementById('maxEnergy').innerText = game.maxEnergy;
    document.getElementById('energyFill').style.width = ((game.energy / game.maxEnergy) * 100).toFixed(1) + "%";

    document.getElementById('level').innerText = game.level;
    document.getElementById('xp').innerText = game.xp;
    document.getElementById('xpToLevel').innerText = game.xpToLevel;
    document.getElementById('xpFill').style.width = ((game.xp / game.xpToLevel) * 100).toFixed(1) + "%";

    const currentPickIndex = Math.min(game.pickaxeLevel - 1, pickaxes.length - 1);
    const currentPick = pickaxes[currentPickIndex];
    game.power = currentPick.power;
    document.getElementById('pickaxeName').textContent = `${currentPick.name} (Сила: ${currentPick.power})`;
    document.querySelector('.stat-row span[data-pickaxe]').setAttribute('data-pickaxe', currentPick.name.toLowerCase().split(' ').at(0)); // Устанавливаем иконку

    const nextPick = pickaxes[game.pickaxeLevel];
    const buyPickBtn = document.getElementById('buyPickBtn');
    if (nextPick) {
        document.getElementById('pickaxeCost').innerHTML = `<strong>${nextPick.cost}</strong> 🪙`;
        buyPickBtn.disabled = game.coins < nextPick.cost;
    } else {
        document.getElementById('pickaxeCost').innerText = `МАКС.`;
        buyPickBtn.disabled = true;
    }

    const mineBtn = document.getElementById('mineBtn');
    if (game.energy <= 0) {
        mineBtn.disabled = true;
        mineBtn.innerText = `⏳ НЕТ ЭНЕРГИИ`;
    } else {
        mineBtn.disabled = false;
        mineBtn.innerText = `⛏️ КОПАТЬ!`;
    }

    // 🍀 СЧАСТЛИВЫЕ ЧАСЫ
    let timeLeftMs = game.nextHappyAt - Date.now();
    if (timeLeftMs > 0 && Date.now() >= game.happyUntil) {
        // Начинаем счастливый час
        game.happyUntil = Date.now() + 180000; // 3 минуты
        showTapPop(`🍀 НАЧАЛИСЬ СЧАСТЛИВЫЕ ЧАСЫ!`, null);
    }

    if (Date.now() < game.happyUntil) {
        document.getElementById('nextHappyTime').classList.add('happy-active');
        document.getElementById('nextHappyTime').textContent = `🍀 СЧАСТЛИВЫЕ ЧАСЫ (${Math.floor(timeLeftMs / 1000)} сек.)`;
    } else {
        document.getElementById('nextHappyTime').classList.remove('happy-active');
        timeLeftMs = game.nextHappyAt - Date.now();
        const minutes = Math.floor(timeLeftMs / 60000);
        const seconds = Math.floor((timeLeftMs % 60000) / 1000);
        document.getElementById('nextHappyTime').textContent = `Через ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
    }
}

function showTapPop(text, event) {
    const container = document.getElementById('btnContainer');
    const pop = document.createElement('div');
    pop.className = 'tap-pop';
    pop.textContent = text;
    const rect = container.getBoundingClientRect();
    let x = rect.width / 2;
    let y = rect.height / 2;
    if (event && event.clientX) {
        x = event.clientX - rect.left;
        y = event.clientY - rect.top;
    }
    pop.style.left = (x - 20) + 'px';
    pop.style.top = (y - 30) + 'px';
    container.appendChild(pop);
    setTimeout(() => { pop.remove(); }, 800);
}

/* --- БЕЗОПАСНОСТЬ ОТ СПАМА КЛИКАМИ --- */
let isMiningLocked = false;

// Основная механика копания
document.getElementById('mineBtn').addEventListener('click', function(e) {
    if (isMiningLocked || game.energy <= 0) return;

    isMiningLocked = true;
    setTimeout(() => isMiningLocked = false, 300); // Блокировка на 300мс

    try {
        verifySave(); // Проверяем сейв прямо сейчас
    } catch(e) {
        alert('Обнаружен взлом сохранения!');
        return;
    }

    game.energy--;
    game.xp += game.power;

    // 🍀 СЧАСТЛИВЫЕ ЧАСЫ (бонус к ресурсам)
    const multiplier = Date.now() < game.happyUntil ? 2 : 1;

    const roll = Math.random();
    if (roll < 0.005 * multiplier) game.diamond++;
    else if (roll < 0.05 * multiplier) game.iron++;
    else if (roll < 0.2 * multiplier) game.gold++;
    else game.stone++;

    game.coins += game.power;

    checkLevelUp();
    saveGame();
});

// Покупка новой кирки
document.getElementById('buyPickBtn').addEventListener('click', function() {
    try {
        verifySave();
    } catch(e) {
        alert('Обнаружен взлом сохранения!');
        return;
    }

    const nextPickIndex = game.pickaxeLevel;
    if (nextPickIndex >= pickaxes.length) return;

    const cost = pickaxes[nextPickIndex].cost;
    if (game.coins >= cost) {
        game.coins -= cost;
        game.pickaxeLevel++;
        showTapPop(`Кирка улучшена! ✨`);
        saveGame();
    }
});

// Продажа камня
document.getElementById('sellStoneBtn').addEventListener('click', function() {
    try {
        verifySave();
    } catch(e) {
        alert('Обнаружен взлом сохранения!');
        return;
    }

    if (game.stone >= 10) {
        game.stone -= 10;
        game.coins += 5;
        showTapPop("+5 🪙");
        saveGame();
    }
});

// Проверка повышения уровня
function checkLevelUp() {
    while (game.xp >= game.xpToLevel) {
        game.xp -= game.xpToLevel;
        game.level++;
        game.xpToLevel = Math.floor(game.xpToLevel * 1.5);
        game.maxEnergy += 10;
        game.energy = game.maxEnergy;
        showTapPop(`Уровень ${game.level}! ⭐`);
    }
}

// Автоматическое восстановление энергии
setInterval(function() {
    if (game.energy < game.maxEnergy) {
        game.energy = Math.min(game.maxEnergy, game.energy + 1);
        saveGame();
    }
}, 1000);

updateUI();
</script>
</body>
</html>
